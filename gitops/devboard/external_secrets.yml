apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database-credentials
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
  kind: ClusterSecretStore
  name: aws-secrets-manager          # name of the SecretStore (or kind specified)

  target:
    name: devboard-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      data:
      POSTGRES_USER: "{{ .POSTGRES_USER }}"
      POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
      POSTGRES_DB: "{{ .POSTGRES_DB }}"
      POSTGRES_URL: "postgres://{{ .username }}:{{ .password }}@postgres:5432/{{ .dbname }}?sslmode=disable"

 
  dataFrom:
  - extract:
      key: devboard/postgres


  
