# Lives in devboard because a Gateway listener can only reference a Secret in its
# own namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devboard-tls
  namespace: devboard
spec:
  secretName: devboard-tls

  dnsNames:
    - devboard.stackforges.com

  # Use the production Let's Encrypt issuer.
  # This replaces the browser-untrusted staging certificate.
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io

  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always

  # Renew 30 days before the 90-day certificate expires.
  renewBefore: 720h