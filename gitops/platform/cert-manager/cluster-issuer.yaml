apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  name: letsencrypt-staging

spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory

    email: aridamansohal@gmail.com

    privateKeySecretRef:
      name: letsencrypt-staging-account-key

    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: devboard-gateway
                namespace: devboard
                kind: Gateway


---
# Production Let's Encrypt issuer.
# Unlike the staging issuer, certificates from this issuer are trusted
# by normal browsers.

apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  name: letsencrypt-prod

spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory

    email: aridamansohal@gmail.com

    privateKeySecretRef:
      name: letsencrypt-prod-account-key

    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: devboard-gateway
                namespace: devboard
                kind: Gateway                