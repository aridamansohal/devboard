name: matrix

on:
  push:
    branches: [feat/matrix-gac]

jobs:
   lint-frontend:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v7

        - name: setup nodejs 
          uses: actions/setup-node@v6
          with:
            node-version: 20
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json

        - name:  install dependencies
          run: npm install
          working-directory: ./frontend

        - name:  run linter
          run: npm run lint
          working-directory: ./frontend

        - name: run test 
          run: npm run test
          working-directory: ./frontend 

   lint-backend:
      runs-on: ubuntu-latest
      steps:

        - name: checkout code
          uses: actions/checkout@v7

        - name: setup go 
          uses: actions/setup-go@v6
          with:
            go-version: 1.23
            go-version-file: 'go.mod'
            cache: true
            cache-dependency-path: ./backend/go.sum

        - name: install go dependecies
          run: go mod download
          working-directory: ./backend

        - name: Verify Formatting
          run: |
           if [ -n "$(gofmt -l ./backend)" ]; then
            echo "Formatting issues detected in the following files:"
            gofmt -l .
            echo "--- Diff output ---"
            gofmt -d .
            exit 1
           fi

        -  name: Static Analysis
           run: go vet ./...
           working-directory: ./backend

        -  name: go test
           run: go test -v ./...
           working-directory: ./backend       

   build-and-push:
         needs: [lint-backend,lint-frontend]
         runs-on: ubuntu-latest
         strategy:
            matrix:
                build-and-push: [frontend, backend]
         steps:
          - name: Checkout code
            uses: actions/checkout@v4
         
          - name: metadata
            id: meta
            uses: docker/metadata-action@v6
            with:
             images: ${{secrets.DOCKERHUB_USERNAME}}/devboard-${{matrix.build-and-push}}
             tags: |
               type=raw,value=latest 
               type=sha,format=short

          -  name: Login to Docker Hub
             uses: docker/login-action@v4
             with:
              username: ${{secrets.DOCKERHUB_USERNAME}}
              password: ${{secrets.DOCKERHUB_TOKEN}}

          -  name: docker build and push 
             uses: docker/build-push-action@v7  
             with:
              context: ./${{matrix.build-and-push}}
              push: true
              tags: ${{steps.meta.outputs.tags}}
              labels: ${{steps.meta.outputs.labels}}
   
   deploy:
      needs: build-and-push
      uses: ./.github/workflows/cd.yml        
      secrets: inherit  
