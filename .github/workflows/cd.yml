#Goal to deploy container after successful completion of the frontend and backend build and test jobs

name: deploy

on:
    workflow_call:

jobs:
    deploy:
        runs-on: [self-hosted]
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_TOKEN}}

            - name: copy env file
              run: cp .env.example .env
              
            - name: deploy container
              run: |
                docker compose pull
                docker compose up -d

