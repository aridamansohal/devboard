name: deploy container

on:
  workflow_dispatch:
  push:
    branches:
      - feat/github_actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Start SSH Agent
          uses: webfactory/ssh-agent@v0.9.0
          with:
           ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

        - name: Test SSH
          run: |
           ssh -o StrictHostKeyChecking=no \
           ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
           hostname

      

