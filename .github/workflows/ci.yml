name: CI

on:
  push:
    branches: [feat/*]

jobs:
    frontend:
      runs-on: ubuntu-latest
      steps:
        - name: checkout code
          uses: actions/checkout@v7

        - name: setup nodejs 
          uses: actions/setup-node@v6
          with:
            node-version: 20
            cache: 'npm'
            cache-dependency-path: ./frontend/package-lock.json

        - name:  install dependencies
          run: npm install
          working-directory: ./frontend

        - name:  run linter
          run: npm run lint
          working-directory: ./frontend

        - name: run test 
          run: npm run test
          working-directory: ./frontend 

        - name: metadata
          id: meta
          uses: docker/metadata-action@v6
          with:
           images: ${{secrets.DOCKERHUB_USERNAME}}/devboard-frontend 
           tags: |
               type=raw,value=latest 
               type=sha,format=short  

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{secrets.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}

        - name: docker build and push 
          uses: docker/build-push-action@v7  
          with:
            context: ./frontend
            push: true
            tags: ${{steps.meta.outputs.tags}}
            labels: ${{steps.meta.outputs.labels}}

    backend:
      runs-on: ubuntu-latest

      steps:

        - name: checkout code
          uses: actions/checkout@v7

        - name: setup go 
          uses: actions/setup-go@v6
          with:
            go-version: 1.23
            go-version-file: 'go.mod'
            cache: true
            cache-dependency-path: ./backend/go.sum

        - name: install go dependecies
          run: go mod download
          working-directory: ./backend

        - name: Verify Formatting
          run: |
           if [ -n "$(gofmt -l ./backend)" ]; then
            echo "Formatting issues detected in the following files:"
            gofmt -l .
            echo "--- Diff output ---"
            gofmt -d .
            exit 1
           fi

        -  name: Static Analysis
           run: go vet ./...
           working-directory: ./backend

        -  name: go test
           run: go test -v ./...
           working-directory: ./backend
           
           
        -  name: metadata
           id: meta
           uses: docker/metadata-action@v6
           with:
            images: ${{secrets.DOCKERHUB_USERNAME}}/devboard-backend 
            tags: |
                type=raw,value=latest
                type=sha,format=short
        
                
        -  name: Login to Docker hub
           uses: docker/login-action@v4
           with:
            username: ${{secrets.DOCKERHUB_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}

        -  name: docker build and push
           uses: docker/build-push-action@v7 
           with:
            context: ./backend
            push: true
            tags: ${{steps.meta.outputs.tags}}
            labels: ${{steps.meta.outputs.labels}}
  