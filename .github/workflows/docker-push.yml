# Goal Push the images to DockerHub
name: Docker Push

on:
    workflow_call:

permissions:
    contents: read
    id-token: write

jobs:
    frontend:
        # Github runner
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folders: ['backend','frontend']
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Docker Setup [Login]
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build and Push
              uses: docker/build-push-action@v7
              with:
                context: ./${{ matrix.folders}}
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders}}:latest

            - name: Generate SBOM
              uses: anchore/sbom-action@v0
              with:
                image: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders}}:latest
                format: spdx-json
                output-file: sbom-${{ matrix.folders}}.spdx.json

            - name: Upload SBOM
              uses: actions/upload-artifact@v4
              with:
                name: sbom-${{ matrix.folders}}
                path: sbom-${{ matrix.folders}}.spdx.json


            - name: Install Cosign
              uses: sigstore/cosign-installer@v4.0.0

            - name: Sign Docker image with Cosign
              env:
                IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest
              run: cosign sign --yes "$IMAGE"
